name: quality
on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: find common tests mnn_example/src ncnn_example/src -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Build dependency-free tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Run C++ regressions
        run: ctest --test-dir build --output-on-failure

  first-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tutorials/requirements.txt
      - name: Install CPU PyTorch
        run: pip install -r tutorials/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Run the beginner lesson
        run: python tutorials/01-first-model/train.py --output /tmp/first-model
      - name: Check the model learned the data
        run: python -c "import json; d=json.load(open('/tmp/first-model/metrics.json')); assert d['final_val_loss'] < d['initial_val_loss'] * .01; assert abs(d['prediction_at_x3'] - 7) < .2"
      - name: Run the classification lesson
        run: |
          python tutorials/02-first-classifier/train.py --output /tmp/first-classifier
          python tutorials/02-first-classifier/infer.py --checkpoint /tmp/first-classifier/classifier.pt --x 1.4 --y -0.7
      - name: Check the classifier learned the data
        run: python -c "import json; d=json.load(open('/tmp/first-classifier/metrics.json')); assert d['validation_accuracy'] > .95; assert len(d['confusion_matrix']) == 3"
      - name: Train and evaluate the end-to-end policy
        run: |
          python projects/end_to_end_driving/01_state_to_control/train.py --epochs 120 --output /tmp/end-to-end-state
          python projects/end_to_end_driving/01_state_to_control/evaluate.py --checkpoint /tmp/end-to-end-state/policy.pt --output /tmp/end-to-end-state --episodes 12 --steps 300 --route-length 180
      - name: Check closed-loop driving
        run: python -c "import json; d=json.load(open('/tmp/end-to-end-state/evaluation.json')); assert d['learned']['completion_rate'] >= .9; assert d['learned']['off_road_rate'] <= .1"
      - name: Train and evaluate vision policies
        run: |
          python projects/end_to_end_driving/02_image_to_control/train.py --epochs 80 --output /tmp/end-to-end-vision
          python projects/end_to_end_driving/02_image_to_control/evaluate.py --checkpoint /tmp/end-to-end-vision/vision-policy.pt --output /tmp/end-to-end-vision --episodes 8 --steps 300 --route-length 180
          python projects/end_to_end_driving/03_image_to_waypoints/train.py --epochs 80 --output /tmp/end-to-end-waypoints
          python projects/end_to_end_driving/03_image_to_waypoints/evaluate.py --checkpoint /tmp/end-to-end-waypoints/waypoint-policy.pt --output /tmp/end-to-end-waypoints --episodes 8 --steps 300 --route-length 180
      - name: Check visual closed-loop driving
        run: python -c "import json; a=json.load(open('/tmp/end-to-end-vision/evaluation.json')); b=json.load(open('/tmp/end-to-end-waypoints/evaluation.json')); assert a['completion_rate'] >= .875 and b['completion_rate'] >= .875; assert a['off_road_rate'] <= .125 and b['off_road_rate'] <= .125"
      - name: Validate the external-data contract
        run: python projects/end_to_end_driving/04_external_data/validate_manifest.py projects/end_to_end_driving/04_external_data/example_manifest.jsonl
