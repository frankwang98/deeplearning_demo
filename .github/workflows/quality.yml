name: quality
on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: find common tests mnn_example/src ncnn_example/src -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Build dependency-free tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Run C++ regressions
        run: ctest --test-dir build --output-on-failure

  first-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tutorials/01-first-model/requirements.txt
      - name: Install CPU PyTorch
        run: pip install -r tutorials/01-first-model/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Run the beginner lesson
        run: python tutorials/01-first-model/train.py --output /tmp/first-model
      - name: Check the model learned the data
        run: python -c "import json; d=json.load(open('/tmp/first-model/metrics.json')); assert d['final_val_loss'] < d['initial_val_loss'] * .01; assert abs(d['prediction_at_x3'] - 7) < .2"
